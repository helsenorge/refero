# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Release

on:
  release:
    types: [released, prereleased]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Clean cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci

      # Build for prerelease (beta)
      - name: Build for beta
        if: github.event.release.prerelease == true
        run: npm run prepare

      # Build for release (stable)
      - name: Build for release
        if: github.event.release.prerelease == false
        run: npm run build:lib

      # Publish beta version with beta tag
      - name: Publish beta
        if: github.event.release.prerelease == true
        run: cd ./lib && npm publish --tag beta --provenance --access public

      # Pick the dist-tag for a stable release. A backport to an older major (e.g. a 24.x
      # hotfix published after 25.0.0) must not drag the "latest" tag backwards, so it goes
      # out under a v.<major> maintenance tag instead. Normal forward releases still get "latest".
      # The tag must not parse as a SemVer range -- npm rejects "v24", "24.x" and "24" alike --
      # hence the dot, which also matches this repo's v.24.1.6 tag style.
      - name: Determine dist-tag
        id: disttag
        if: github.event.release.prerelease == false
        run: |
          PKG="$(node -p "require('./lib/package.json').name")"
          VERSION="$(node -p "require('./lib/package.json').version")"
          LATEST="$(npm view "$PKG" version 2>/dev/null || echo 0.0.0)"
          if [ "$VERSION" = "$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | tail -n1)" ]; then
            TAG=latest
          else
            TAG="v.${VERSION%%.*}"
          fi
          echo "Publishing $VERSION under dist-tag '$TAG' (current latest: $LATEST)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Publish stable version under the dist-tag resolved above
      - name: Publish release
        if: github.event.release.prerelease == false
        run: cd ./lib && npm publish --tag ${{ steps.disttag.outputs.tag }} --provenance --access public
